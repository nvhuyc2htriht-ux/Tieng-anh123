<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tiếng Anh 123</title>
<style>
:root{--blue:#174ea6;--blue2:#2878d0;--ink:#172033;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:var(--ink);line-height:1.5}
header{background:linear-gradient(120deg,#123b78,#2878d0);color:white;padding:34px 18px}
.wrap{max-width:1000px;margin:auto;padding:0 18px}h1{font-size:clamp(30px,6vw,44px);margin:0 0 8px}header p{margin:0;opacity:.9}
main{padding:28px 0 55px}.intro{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:15px}
.card{background:white;border:1px solid #e5eaf2;border-radius:16px;padding:20px;box-shadow:0 5px 20px #14213d0a}
.card h2{margin:0 0 6px}.card p{color:var(--muted);margin:0 0 14px}
button,.link{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:#eaf2ff;color:var(--blue);font-weight:700}
button:hover,.link:hover{background:#dceaff}.grade-buttons{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 22px}
.grade-buttons button.active{background:var(--blue);color:white}
.panel{display:none}.panel.active{display:block}
.section-title{font-size:21px;margin:25px 0 12px}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.links button{background:white;border:1px solid #e3eaf4;text-align:left}
.links button:hover{border-color:var(--blue2);background:#f0f6ff}
#lesson{display:none;margin-top:24px;background:white;border:1px solid #e5eaf2;border-radius:15px;padding:20px}
#lesson.show{display:block}#lesson h3{margin-top:0}.back{margin-top:12px}
footer{text-align:center;color:var(--muted);padding:22px;font-size:14px}
</style></head>
<body>
<header><div class="wrap"><h1>TIẾNG ANH 123</h1><p>Hệ thống học tập và ôn luyện Tiếng Anh lớp 6, 7, 8, 9</p></div></header>
<main class="wrap">
<p class="intro">Chọn khối lớp, sau đó chọn Unit hoặc Review để mở nội dung.</p>
<div class="grade-buttons" id="gradeButtons">
<button class="active" data-grade="6">Tiếng Anh 6</button><button data-grade="7">Tiếng Anh 7</button>
<button data-grade="8">Tiếng Anh 8</button><button data-grade="9">Tiếng Anh 9</button>
</div>
<div id="panels"></div>
<div id="lesson"><h3 id="lessonTitle"></h3><p id="lessonText">Nội dung bài học sẽ được cập nhật tại đây.</p><p><b>Các mục có thể bổ sung:</b> Vocabulary · Grammar · Practice · Test</p><button class="back" id="backBtn">← Quay lại danh sách bài</button></div>
</main><footer>TIẾNG ANH 123 · Học tốt mỗi ngày</footer>
<script>
const panels=document.getElementById('panels');
[6,7,8,9].forEach((g,index)=>{
 const panel=document.createElement('section');panel.className='panel'+(g===6?' active':'');panel.id='grade'+g;
 panel.innerHTML=`<div class="card"><h2>Tiếng Anh ${g}</h2><p>12 Units · 4 Reviews · Global Success</p></div>
 <h2 class="section-title">📘 Units</h2><div class="links units"></div>
 <h2 class="section-title">📝 Reviews</h2><div class="links reviews"></div>`;
 for(let i=1;i<=12;i++){const b=document.createElement('button');b.textContent='Unit '+i;b.onclick=()=>openLesson(g,'Unit '+i);panel.querySelector('.units').appendChild(b)}
 for(let i=1;i<=4;i++){const b=document.createElement('button');b.textContent='Review '+i;b.onclick=()=>openLesson(g,'Review '+i);panel.querySelector('.reviews').appendChild(b)}
 panels.appendChild(panel);
});
function selectGrade(g){document.querySelectorAll('.grade-buttons button').forEach(b=>b.classList.toggle('active',b.dataset.grade===String(g)));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='grade'+g));document.getElementById('lesson').classList.remove('show')}
document.querySelectorAll('.grade-buttons button').forEach(b=>b.addEventListener('click',()=>selectGrade(b.dataset.grade)));
function openLesson(g,name){document.getElementById('lessonTitle').textContent=`Tiếng Anh ${g} · ${name}`;document.getElementById('lessonText').textContent=`Trang ${name} của chương trình Tiếng Anh ${g}. Anh có thể bổ sung từ vựng, ngữ pháp, bài tập, file PDF hoặc đường link bài học tại đây.`;document.getElementById('lesson').classList.add('show');document.getElementById('lesson').scrollIntoView({behavior:'smooth'})}
document.getElementById('backBtn').onclick=()=>document.getElementById('lesson').classList.remove('show');
</script></body></html>
